<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Aval</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #eef6f4;
        --text: #0b1b2b;
        --muted: #46596c;
        --ring: #059669;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07141a;
          --text: #e6eef7;
          --muted: #a3b3c6;
          --ring: #34d399;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(60rem 40rem at 10% -10%, rgb(27 78 158 / 0.18), transparent 60%),
          radial-gradient(50rem 36rem at 110% 10%, rgb(11 122 97 / 0.18), transparent 60%),
          var(--bg);
        color: var(--text);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        margin: 20px 0 6px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, #0b7a61, #1b4e9e);
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .status {
        margin-top: 14px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1d4ed8" />
            <stop offset="1" stop-color="#0f766e" />
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="15" fill="url(#g)" />
        <path d="M14 31.5c0-7.5 4.6-15 10-15s10 7.5 10 15M18.5 26h11" stroke="#fff" stroke-width="3.4" stroke-linecap="round" fill="none" />
        <circle cx="34.5" cy="33" r="3" fill="#6ee7b7" />
      </svg>
      <h1>You're offline</h1>
      <p>Aval keeps your chats in the cloud, not on this device, so it needs a connection to show them.</p>
      <button type="button" id="retry">Try again</button>
      <p class="status" role="status" id="status">We'll reload as soon as you're back online.</p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
